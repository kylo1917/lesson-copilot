<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Copilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg: oklch(98% 0.006 80);
  --surface: oklch(99% 0.003 80);
  --surface-2: oklch(96% 0.007 80);
  --border: oklch(90% 0.01 260);
  --border-soft: oklch(93% 0.008 260);
  --text: oklch(24% 0.02 260);
  --text-2: oklch(46% 0.02 260);
  --text-3: oklch(60% 0.015 260);
  --accent: #3f8c80;
  --accent-ink: oklch(32% 0.07 175);
  --accent-tint: oklch(94% 0.03 175);
  --accent-strong: oklch(46% 0.09 175);
  --good: oklch(52% 0.13 145);
  --good-tint: oklch(94% 0.035 145);
  --bad: oklch(54% 0.16 25);
  --bad-tint: oklch(94% 0.035 25);
  --warn: oklch(58% 0.13 80);
  --cat-grammar: oklch(52% 0.13 260); --cat-grammar-tint: oklch(94% 0.02 260);
  --cat-vocab: oklch(52% 0.14 330);   --cat-vocab-tint: oklch(94% 0.025 330);
  --cat-pron: oklch(55% 0.14 75);     --cat-pron-tint: oklch(94% 0.03 75);
  --cat-usage: oklch(53% 0.15 20);    --cat-usage-tint: oklch(94% 0.03 20);
  --type-vocabulary: var(--accent-strong); --type-vocabulary-tint: var(--accent-tint);
  --type-phrasal: oklch(50% 0.13 255);   --type-phrasal-tint: oklch(94% 0.02 255);
  --type-collocation: oklch(48% 0.13 300); --type-collocation-tint: oklch(94% 0.02 300);
  --type-idiom: oklch(56% 0.13 70);      --type-idiom-tint: oklch(94% 0.03 70);
  --type-metaphor: oklch(52% 0.15 10);   --type-metaphor-tint: oklch(94% 0.03 10);
  --shadow-sm: 0 1px 2px oklch(20% 0.02 260 / 0.06);
  --shadow-md: 0 4px 16px oklch(20% 0.02 260 / 0.07), 0 1px 3px oklch(20% 0.02 260 / 0.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg: oklch(21% 0.015 260); --surface: oklch(25% 0.015 260); --surface-2: oklch(28% 0.017 260);
    --border: oklch(37% 0.02 260); --border-soft: oklch(32% 0.018 260);
    --text: oklch(94% 0.006 80); --text-2: oklch(76% 0.012 260); --text-3: oklch(62% 0.012 260);
    --accent: #5fb3a5; --accent-ink: oklch(90% 0.05 175); --accent-tint: oklch(32% 0.06 175); --accent-strong: oklch(74% 0.1 175);
    --good: oklch(72% 0.14 145); --good-tint: oklch(32% 0.06 145);
    --bad: oklch(72% 0.15 25); --bad-tint: oklch(34% 0.08 25);
    --warn: oklch(76% 0.12 80);
    --cat-grammar: oklch(76% 0.1 260); --cat-grammar-tint: oklch(30% 0.05 260);
    --cat-vocab: oklch(76% 0.11 330); --cat-vocab-tint: oklch(30% 0.06 330);
    --cat-pron: oklch(78% 0.11 75); --cat-pron-tint: oklch(32% 0.06 75);
    --cat-usage: oklch(76% 0.12 20); --cat-usage-tint: oklch(32% 0.06 20);
    --type-vocabulary: var(--accent-strong); --type-vocabulary-tint: var(--accent-tint);
    --type-phrasal: oklch(76% 0.09 255); --type-phrasal-tint: oklch(30% 0.05 255);
    --type-collocation: oklch(76% 0.1 300); --type-collocation-tint: oklch(30% 0.05 300);
    --type-idiom: oklch(80% 0.11 70); --type-idiom-tint: oklch(32% 0.06 70);
    --type-metaphor: oklch(76% 0.12 10); --type-metaphor-tint: oklch(32% 0.06 10);
    --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.3); --shadow-md: 0 4px 16px oklch(0% 0 0 / 0.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg: oklch(21% 0.015 260); --surface: oklch(25% 0.015 260); --surface-2: oklch(28% 0.017 260);
  --border: oklch(37% 0.02 260); --border-soft: oklch(32% 0.018 260);
  --text: oklch(94% 0.006 80); --text-2: oklch(76% 0.012 260); --text-3: oklch(62% 0.012 260);
  --accent: #5fb3a5; --accent-ink: oklch(90% 0.05 175); --accent-tint: oklch(32% 0.06 175); --accent-strong: oklch(74% 0.1 175);
  --good: oklch(72% 0.14 145); --good-tint: oklch(32% 0.06 145);
  --bad: oklch(72% 0.15 25); --bad-tint: oklch(34% 0.08 25);
  --warn: oklch(76% 0.12 80);
  --cat-grammar: oklch(76% 0.1 260); --cat-grammar-tint: oklch(30% 0.05 260);
  --cat-vocab: oklch(76% 0.11 330); --cat-vocab-tint: oklch(30% 0.06 330);
  --cat-pron: oklch(78% 0.11 75); --cat-pron-tint: oklch(32% 0.06 75);
  --cat-usage: oklch(76% 0.12 20); --cat-usage-tint: oklch(32% 0.06 20);
  --type-vocabulary: var(--accent-strong); --type-vocabulary-tint: var(--accent-tint);
  --type-phrasal: oklch(76% 0.09 255); --type-phrasal-tint: oklch(30% 0.05 255);
  --type-collocation: oklch(76% 0.1 300); --type-collocation-tint: oklch(30% 0.05 300);
  --type-idiom: oklch(80% 0.11 70); --type-idiom-tint: oklch(32% 0.06 70);
  --type-metaphor: oklch(76% 0.12 10); --type-metaphor-tint: oklch(32% 0.06 10);
  --shadow-sm: 0 1px 2px oklch(0% 0 0 / 0.3); --shadow-md: 0 4px 16px oklch(0% 0 0 / 0.35);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'IBM Plex Sans',system-ui,sans-serif;
  font-size:14px; line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent-tint)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:var(--accent-strong)}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:4px}

.shell{max-width:1180px;margin:0 auto;padding:22px 24px 64px}
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--border-soft)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:white;font-size:14px;flex:0 0 auto}
.brand-name{font-size:16px;font-weight:600;letter-spacing:-0.01em}
.brand-tag{font-size:11.5px;color:var(--text-3)}

.studentbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.studentchip{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:100px;border:1px solid var(--border);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.studentchip.active{border-color:var(--accent-strong);box-shadow:0 0 0 1px var(--accent-strong) inset}
.studentchip:hover{border-color:var(--text-3)}
.avatar{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:white;flex:0 0 auto}
.studentchip .name{font-size:12.5px;font-weight:500}
.livepip{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:0 0 auto;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.livepip{animation:none}}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--text-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:white}
.btn-primary:hover{opacity:.9;border-color:var(--accent)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:white}
.btn-ghost{border-color:transparent;background:transparent;padding:8px 10px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.icon{width:14px;height:14px;flex:0 0 auto}

.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border-soft)}
.tab{padding:9px 4px;margin-right:22px;font-size:13.5px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-sm)}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.07em;color:var(--text-3);text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.field input[type="range"]{padding:0;accent-color:var(--accent)}
.field textarea{resize:vertical;min-height:52px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-strong)}
.formrow{display:flex;gap:10px;flex-wrap:wrap}
.formrow>.field{flex:1 1 140px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:100px}
.emptystate{text-align:center;padding:70px 20px;color:var(--text-2)}
.emptystate h2{font-size:19px;margin-bottom:8px;color:var(--text)}
.emptystate .btn{margin-top:16px}

.mistakecard{border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--border-soft);background:var(--surface)}
.mistakecard.flagged{border-color:color-mix(in oklch, var(--warn) 45%, var(--border-soft))}
.mistakecard .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.mistakecard .txt{font-size:13px;line-height:1.5}
.mistakecard .fix{font-size:12px;color:var(--text-2)}
.count{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:3px 7px;border-radius:100px;background:var(--warn);color:white;white-space:nowrap}
.mini{font-size:11.5px;color:var(--text-3)}
.quietlist{display:flex;flex-direction:column;gap:4px}
.quietrow{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:12.5px;color:var(--text-2);border-bottom:1px dashed var(--border-soft)}
.quietrow:last-child{border-bottom:none}
.xbtn{margin-left:auto;color:var(--text-3);font-size:15px;line-height:1;flex:0 0 auto}
.xbtn:hover{color:var(--bad)}

.statrow{display:flex;gap:14px;flex-wrap:wrap}
.stat{flex:1 1 120px;background:var(--surface-2);border-radius:11px;padding:12px 14px}
.stat .num{font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;line-height:1.1}
.stat .lbl{font-size:11px;color:var(--text-2);margin-top:2px}
.deltabadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:100px}
.delta-up{background:var(--good-tint);color:var(--good)}
.delta-down{background:var(--bad-tint);color:var(--bad)}
.delta-flat{background:var(--surface-2);color:var(--text-2)}

.glossgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.glosscard{border:1px solid var(--border-soft);border-radius:11px;padding:12px 13px;display:flex;flex-direction:column;gap:6px}
.glosscard .term{font-size:14px;font-weight:600}
.glosscard .meaning{font-size:12.5px;color:var(--text-2)}
.glosscard .example{font-size:12px;color:var(--text-3);font-style:italic}

.flash{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 20px}
.flashcard{width:100%;max-width:420px;min-height:190px;border-radius:16px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-md);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.flashcard .term{font-size:22px;font-weight:700}
.flashcard .reveal{display:flex;flex-direction:column;gap:8px}
.flashcard .meaning{font-size:14px;color:var(--text-2)}
.flashcard .example{font-size:13px;color:var(--text-3);font-style:italic}
.flashcard .tap{font-size:11.5px;color:var(--text-3)}
.flashctrl{display:flex;gap:8px;align-items:center}

.timerbox{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:100px;background:var(--bad-tint)}
.timerbox .dot{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pulse 1.6s ease-in-out infinite}
.timerbox .t{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;color:var(--bad)}

.overlay{position:fixed;inset:0;background:oklch(15% 0.01 260 / 0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;width:100%;max-width:420px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:16px}
.modalrow{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12.5px;font-weight:500;padding:9px 16px;border-radius:100px;box-shadow:var(--shadow-md);z-index:200}

.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;margin-bottom:12px}
.sectionhead h3{font-size:14px}
.help{font-size:12px;color:var(--text-3);line-height:1.55}
.stack{display:flex;flex-direction:column;gap:14px}
.divider{height:1px;background:var(--border-soft);margin:16px 0}
table.sess{width:100%;border-collapse:collapse;font-size:12.5px}
table.sess th{text-align:left;font-size:10.5px;letter-spacing:.05em;color:var(--text-3);font-weight:600;padding:0 8px 6px 8px;text-transform:uppercase}
table.sess td{padding:7px 8px;border-top:1px solid var(--border-soft);vertical-align:top}
table.sess td.notes{color:var(--text-2);max-width:280px}

@media print{
  body{background:white;color:black}
  .no-print{display:none!important}
  .shell{max-width:100%;padding:0 8px}
  .card{box-shadow:none;border-color:#ccc}
}

.recbtn{background:var(--bad);border-color:var(--bad);color:white}
.recbtn:hover{opacity:.9}
.recbtn.off{background:var(--surface);border-color:var(--border);color:var(--text)}
.recbanner{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;font-size:12.5px;font-weight:600;margin-bottom:10px}
.recbanner .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto;animation:pulse 1.6s ease-in-out infinite}
.recbanner.live{background:var(--good-tint);color:var(--good)}
.recbanner.stalled{background:var(--bad-tint);color:var(--bad)}
.recbanner.off{background:var(--surface-2);color:var(--text-3);font-weight:500}
.translog{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow-y:auto;margin-top:6px}
.transline{display:flex;align-items:flex-start;gap:8px;padding:7px 8px;border-radius:8px;border-left:3px solid transparent;font-size:12.5px}
.transline.tag-repair{border-color:var(--warn);background:color-mix(in oklch, var(--warn) 8%, transparent)}
.transline.tag-watch{border-color:var(--accent-strong);background:var(--accent-tint)}
.transline.tag-filler{border-color:var(--border);opacity:.72}
.transline .txt{flex:1 1 auto;line-height:1.5}
.transline .tagpill{font-size:9.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;margin-right:6px}
.transline .acts{display:flex;gap:4px;flex:0 0 auto}
.linkbtn{font-size:11px;font-weight:600;color:var(--accent-strong);white-space:nowrap;padding:2px 5px;border-radius:5px}
.linkbtn:hover{background:var(--accent-tint)}
.linkbtn.muted{color:var(--text-3)}
.watchchips{display:flex;flex-wrap:wrap;gap:6px}
.watchchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 8px;border-radius:100px;background:var(--surface-2);border:1px solid var(--border-soft)}
.reviewbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:100px;background:var(--warn);color:white;font-size:10px;font-weight:700}
</style>

<div id="app"></div>
<div id="toastHost"></div>

<script>
/* ---------- data ---------- */
const STORE_KEY = 'lessoncopilot_v1';
const COLORS = ['#3f8c80','#5b7fb5','#8a6fb0','#c98a4b','#b0555b','#5a9b6a','#a17f3f'];
const CATS = {
  grammar: {label:'Grammar', v:'--cat-grammar', t:'--cat-grammar-tint'},
  vocab:   {label:'Word choice', v:'--cat-vocab', t:'--cat-vocab-tint'},
  pron:    {label:'Pronunciation', v:'--cat-pron', t:'--cat-pron-tint'},
  usage:   {label:'Usage', v:'--cat-usage', t:'--cat-usage-tint'}
};
const GTYPES = {
  vocabulary:  {label:'Vocabulary', v:'--type-vocabulary', t:'--type-vocabulary-tint'},
  phrasal:     {label:'Phrasal verb', v:'--type-phrasal', t:'--type-phrasal-tint'},
  collocation: {label:'Collocation', v:'--type-collocation', t:'--type-collocation-tint'},
  idiom:       {label:'Idiom', v:'--type-idiom', t:'--type-idiom-tint'},
  metaphor:    {label:'Metaphor', v:'--type-metaphor', t:'--type-metaphor-tint'}
};
const LANGMAP = {
  english:'en-US', spanish:'es-ES', french:'fr-FR', german:'de-DE', italian:'it-IT',
  portuguese:'pt-PT', mandarin:'zh-CN', chinese:'zh-CN', japanese:'ja-JP', korean:'ko-KR',
  russian:'ru-RU', arabic:'ar-SA'
};
const LANGOPTS = [
  ['en-US','English'],['es-ES','Spanish'],['fr-FR','French'],['de-DE','German'],['it-IT','Italian'],
  ['pt-PT','Portuguese'],['zh-CN','Mandarin'],['ja-JP','Japanese'],['ko-KR','Korean'],['ru-RU','Russian'],['ar-SA','Arabic']
];
function guessLangCode(langName){ return LANGMAP[norm(langName).replace(/\s+/g,'')] || 'en-US'; }
const TAGMETA = {
  repair: {label:'Possible self-correction'},
  watch:  {label:'Watchlist match'},
  filler: {label:'Filler / hesitation'}
};

function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' '); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function avg(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function fmtDate(ts){ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtDateFull(ts){ return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function colorFor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; }
function initials(name){ return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('') || '?'; }

function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { students: [], activeStudentId: null, liveSession: null };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

const STUDENT_MODE = new URLSearchParams(location.search).get('student') === '1';
const STUDENT_STORE_KEY = 'lessoncopilot_student_v1';
function loadStudentState(){
  try{ const raw = localStorage.getItem(STUDENT_STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return { student: null };
}
function saveStudentState(){ localStorage.setItem(STUDENT_STORE_KEY, JSON.stringify(studentState)); }
let studentState = loadStudentState();

let state = load();
let view = 'session'; // 'session' | 'file'
let showFullLog = false;
let practice = { active:false, idx:0, order:[], revealed:false, typeFilter:'all' };
let timerHandle = null;
let pendingEnd = false;
let reviewSessionId = null;

function activeStudent(){ return state.students.find(s=>s.id===state.activeStudentId) || null; }

function toast(msg){

function deleteStudent(id){

  if(!confirm(`Delete ${s.name}'s entire file? This removes their mistake history and glossary permanently and can't be undone.`)) return;
  if(state.liveSession && state.liveSession.studentId===id) state.liveSession=null;
  state.students = state.students.filter(x=>x.id!==id);
  if(state.activeStudentId===id) state.activeStudentId = state.students[0]?.id || null;

/* ---------- live session ---------- */
function startSession(){
  const st = activeStudent(); if(!st) return;
  if(state.liveSession && state.liveSession.studentId!==st.id){ toast('Finish the session in progress for the other student first'); return; }
  state.liveSession = { studentId: st.id, sessionId: uid(), startedAt: Date.now(), transcript: [] };
  save(); render();
}
function liveMistakeFor(st){ return state.liveSession && state.liveSession.studentId===st.id ? state.liveSession : null; }
function transcriptFor(st, sessionId){
  if(state.liveSession && state.liveSession.sessionId===sessionId) return state.liveSession.transcript;
  const sess = st.sessions.find(s=>s.id===sessionId);
  return sess ? (sess.transcript || (sess.transcript=[])) : null;
}

/* ---------- recording & heuristic tagging ---------- */
let recognizer = null, recActive = false, recState = 'off', recFailStreak = 0, recRestartTimer = null, recStartedAt = 0;
function speechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function wordOverlap(a,b){
  const sa = new Set(norm(a).split(' ').filter(Boolean));
  const sb = new Set(norm(b).split(' ').filter(Boolean));
  if(!sa.size || !sb.size) return 0;
  let inter=0; sa.forEach(w=>{ if(sb.has(w)) inter++; });
  return inter/Math.max(sa.size,sb.size);
}
const FILLER_RE = /\b(um+|uh+|erm+|like|you know|i mean|sort of|kind of)\b/i;
function tagLine(st, text, prevText){
  const tags = [];
  if(FILLER_RE.test(text)) tags.push('filler');
  if(prevText && norm(prevText)!==norm(text) && wordOverlap(prevText,text) >= 0.5) tags.push('repair');
  const watch = st.watchlist||[];
  const lower = text.toLowerCase();
  if(watch.some(w=> w && lower.includes(w.toLowerCase()))) tags.push('watch');
  return tags;
}
function toggleRecording(){ recActive ? stopRecording() : startRecording(); }
function startRecording(){
  const st = activeStudent(); const live = liveMistakeFor(st); if(!live) return;
  if(!speechSupported()){ toast('Speech recognition needs Chrome'); return; }
  clearTimeout(recRestartTimer);
  recFailStreak = 0;
  launchRecognizer(st);
  recActive = true;
  recState = 'listening';
  updateRecUI();
}
function launchRecognizer(st){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognizer = new SR();
  recognizer.continuous = true;
  recognizer.interimResults = true;
  recognizer.lang = st.speechLang || guessLangCode(st.lang);
  recognizer.onresult = handleRecResult;
  recognizer.onerror = (e) => {
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){
      toast('Microphone access was blocked — allow it in the browser to record');
      recState = 'off'; recActive = false; recognizer = null; updateRecUI();
      return;
    }
    // 'no-speech' and 'network' are routine and expected during quiet moments — onend handles the restart
  };
  recognizer.onstart = () => { recStartedAt = Date.now(); };
  recognizer.onend = () => {
    if(!recActive) return;
    const livedFor = Date.now() - recStartedAt;
    recFailStreak = livedFor < 1500 ? recFailStreak + 1 : 0;
    if(recFailStreak >= 4){
      recState = 'stalled'; recActive = false;
      updateRecUI();
      return;
    }
    recRestartTimer = setTimeout(() => { if(recActive) launchRecognizer(activeStudentForLiveSession()); }, 350);
  };
  recStartedAt = Date.now();
  try{ recognizer.start(); }catch(e){}
}
function activeStudentForLiveSession(){
  return state.liveSession ? state.students.find(s=>s.id===state.liveSession.studentId) : null;
}
function resumeRecording(){
  const st = activeStudentForLiveSession(); if(!st) return;
  recFailStreak = 0; recState = 'listening'; recActive = true;
  launchRecognizer(st);
  updateRecUI();
}
function stopRecording(){
  recActive = false; recState = 'off';
  clearTimeout(recRestartTimer);
  try{ recognizer && recognizer.stop(); }catch(e){}
  recognizer = null;
  updateRecUI();
}
function updateRecUI(){
  const btn = document.getElementById('recToggleBtn');
  if(btn){ btn.textContent = recActive ? 'Stop recording' : 'Start recording'; btn.classList.toggle('recbtn', recActive); btn.classList.toggle('off', !recActive); }
  const banner = document.getElementById('recBanner');
  if(banner){
    if(recState==='listening') banner.outerHTML = `<div id="recBanner" class="recbanner live"><span class="dot"></span>Recording — listening</div>`;
    else if(recState==='stalled') banner.outerHTML = `<div id="recBanner" class="recbanner stalled">Recording stopped unexpectedly<button class="btn btn-sm" style="margin-left:auto" onclick="resumeRecording()">Resume</button></div>`;
    else banner.outerHTML = `<div id="recBanner" class="recbanner off">Not recording</div>`;
  }
}
function handleRecResult(e){
  const live = state.liveSession; if(!live) return;
  const st = state.students.find(s=>s.id===live.studentId); if(!st) return;
  recFailStreak = 0;
  let interim = '';
  for(let i=e.resultIndex;i<e.results.length;i++){
    const res = e.results[i];
    const text = res[0].transcript.trim();
    if(res.isFinal){ if(text) pushTranscriptLine(st, live, text); }
    else interim += text;
  }
  if(activeStudent()?.id !== st.id) return;
  const interimEl = document.getElementById('interimLine');
  if(interimEl) interimEl.textContent = interim;
}
function pushTranscriptLine(st, live, text){
  const prev = live.transcript[live.transcript.length-1];
  const line = { id:uid(), t: Date.now()-live.startedAt, text, tags: tagLine(st, text, prev?prev.text:null), done:false };
  live.transcript.push(line);
  save();
  const log = document.getElementById('transcriptLog');
  if(log){
    log.insertAdjacentHTML('beforeend', transcriptLineHTML(live.sessionId, line));
    log.scrollTop = log.scrollHeight;
  }
}
function transcriptLineHTML(sessionId, line){
  const tagLabel = line.tags.includes('watch') ? TAGMETA.watch.label : line.tags.includes('repair') ? TAGMETA.repair.label : line.tags.includes('filler') ? TAGMETA.filler.label : '';
  const cls = line.tags.includes('watch') ? 'tag-watch' : line.tags.includes('repair') ? 'tag-repair' : line.tags.includes('filler') ? 'tag-filler' : '';
  return `<div class="transline ${cls}" data-line="${line.id}">
    <div class="txt">${tagLabel?`<span class="tagpill">${tagLabel}</span>`:''}${esc(line.text)}</div>
    <div class="acts no-print">
      <button class="linkbtn" onclick="openTagAsMistake('${sessionId}','${line.id}')">+ mistake</button>
      <button class="linkbtn" onclick="openTagAsVocab('${sessionId}','${line.id}')">+ vocab</button>
      <button class="linkbtn muted" onclick="dismissLine('${sessionId}','${line.id}')">dismiss</button>
    </div>
  </div>`;
}
function findLine(sessionId, lineId){
  const st = activeStudent(); if(!st) return null;
  const t = transcriptFor(st, sessionId); if(!t) return null;
  return t.find(l=>l.id===lineId) || null;
}
function dismissLine(sessionId, lineId){
  const line = findLine(sessionId, lineId); if(!line) return;
  line.done = true; save();
  document.querySelector(`[data-line="${lineId}"]`)?.remove();
}

function confirmTagAsMistake(sessionId, lineId){

function confirmTagAsVocab(sessionId, lineId){
  const st = activeStudent(); if(!st) return;
  const term = document.getElementById('tgTerm').value.trim();
  const type = document.getElementById('tgType').value;
  const meaning = document.getElementById('tgMean').value.trim();

function addWatchTerm(){
  const st = activeStudent(); if(!st) return;
  const input = document.getElementById('watchInput');
  const term = input.value.trim(); if(!term) return;
  st.watchlist = st.watchlist || [];
  if(!st.watchlist.some(w=>norm(w)===norm(term))) st.watchlist.push(term);
  input.value = '';
  save(); render();
}
function removeWatchTerm(term){
  const st = activeStudent(); if(!st) return;
  st.watchlist = (st.watchlist||[]).filter(w=>w!==term);
  save(); render();
}

function addMistake(st, sessionId, text, correction, category){
  if(!text) return null;
  const key = category+'|'+norm(text);
  let m = st.mistakes.find(x=> (x.category+'|'+norm(x.text))===key );
  if(m){
    if(correction && !m.correction) m.correction = correction;
    m.occurrences.push({sessionId, date: Date.now()});
  } else {
    m = { id:uid(), category, text, correction, occurrences:[{sessionId, date: Date.now()}] };
    st.mistakes.push(m);
  }
  return m;
}
function addGlossary(st, sessionId, term, type, meaning, example){
  if(!term) return null;
  const key = type+'|'+norm(term);
  let g = st.glossary.find(x=> (x.type+'|'+norm(x.term))===key );
  if(g){
    if(meaning) g.meaning = meaning;
    if(example) g.example = example;
    g.occurrences.push({sessionId, date: Date.now()});
  } else {
    g = { id:uid(), type, term, meaning, example, occurrences:[{sessionId, date: Date.now()}] };
    st.glossary.push(g);
  }
  return g;
}
function logMistake(){
  const st = activeStudent(); const live = liveMistakeFor(st); if(!live) return;
  const text = document.getElementById('mText').value.trim();
  if(!text){ toast('Add what was said first'); return; }
  const correction = document.getElementById('mFix').value.trim();
  const category = document.getElementById('mCat').value;
  addMistake(st, live.sessionId, text, correction, category);
  save(); render();
}
function removeMistake(id){
  const st = activeStudent(); if(!st) return;
  st.mistakes = st.mistakes.filter(m=>m.id!==id);
  save(); render();
}
function logGlossary(){
  const st = activeStudent(); const live = liveMistakeFor(st); if(!live) return;
  const term = document.getElementById('gTerm').value.trim();
  if(!term){ toast('Add the term first'); return; }
  const type = document.getElementById('gType').value;
  const meaning = document.getElementById('gMean').value.trim();
  const example = document.getElementById('gEx').value.trim();
  addGlossary(st, live.sessionId, term, type, meaning, example);
  save(); render();
}
function removeGlossary(id){
  const st = activeStudent(); if(!st) return;
  st.glossary = st.glossary.filter(g=>g.id!==id);
  save(); render();
}

function sessionStats(st, sessionId){
  const flagged = st.mistakes.filter(m => m.occurrences.some(o=>o.sessionId===sessionId) && m.occurrences.length>1);
  const firstTime = st.mistakes.filter(m => m.occurrences.some(o=>o.sessionId===sessionId) && m.occurrences.length===1);
  const vocab = st.glossary.filter(g => g.occurrences.some(o=>o.sessionId===sessionId));
  return { flagged, firstTime, vocab };
}
function autoScore(st, sessionId){
  const {flagged, firstTime, vocab} = sessionStats(st, sessionId);
  return clamp(Math.round(100 - flagged.length*9 - firstTime.length*2 + Math.min(vocab.length,5)), 0, 100);
}

function openEndSession(){
  const st = activeStudent(); const live = liveMistakeFor(st); if(!live) return;
  const score = autoScore(st, live.sessionId);
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Finish session with ${esc(st.name)}</h3>
      <div class="field">
        <label>Performance this session <span id="scoreOut" class="mono">${score}%</span></label>
        <input type="range" min="0" max="100" value="${score}" id="scoreRange"
          oninput="document.getElementById('scoreOut').textContent=this.value+'%'">
      </div>
      <div class="field"><label>Session notes (optional)</label>
        <textarea id="sessNotes" placeholder="Focus for next time, homework given, wins to mention..."></textarea>
      </div>
      <div class="modalrow">
        <button class="btn" onclick="closeModal()">Keep going</button>
        <button class="btn btn-primary" onclick="confirmEndSession()">Save session</button>
      </div>
    </div>`;
  overlay.id='modalHost';
  document.body.appendChild(overlay);
}
function confirmEndSession(){
  const st = activeStudent(); const live = liveMistakeFor(st); if(!live) return;
  stopRecording();
  const rating = Number(document.getElementById('scoreRange').value);
  const notes = document.getElementById('sessNotes').value.trim();
  const {flagged, firstTime, vocab} = sessionStats(st, live.sessionId);
  const unreviewed = (live.transcript||[]).filter(l=>!l.done && l.tags.length).length;
  st.sessions.push({
    id: live.sessionId, date: live.startedAt,
    durationMin: Math.max(1, Math.round((Date.now()-live.startedAt)/60000)),
    rating, notes, mistakeCount: flagged.length+firstTime.length, recurringCount: flagged.length, vocabCount: vocab.length,
    transcript: live.transcript||[]
  });
  state.liveSession = null;
  closeModal(); save(); view='file'; render();
  toast(unreviewed ? `Saved — ${unreviewed} transcript moment${unreviewed===1?'':'s'} to review when you have time` : 'Session saved to '+st.name+"'s file");
}
function discardSession(){
  if(!confirm('Discard this session? Mistakes and vocabulary already logged will stay in the file, but no session record, transcript or score will be saved.')) return;
  stopRecording();
  state.liveSession = null; save(); render();
}

/* ---------- timer ---------- */
function tickTimer(){
  const el = document.getElementById('timerDisplay');
  if(!el || !state.liveSession) return;
  const sec = Math.floor((Date.now()-state.liveSession.startedAt)/1000);
  const m = String(Math.floor(sec/60)).padStart(2,'0'), s = String(sec%60).padStart(2,'0');
  el.textContent = m+':'+s;
}

/* ---------- progression math ---------- */
function progression(st){
  const ratings = st.sessions.map(s=>s.rating);
  const cum = ratings.map((_,i)=> avg(ratings.slice(0,i+1)));
  const n = ratings.length;
  const prevAvg = n>=2 ? avg(ratings.slice(0,n-1)) : null;
  const delta = (n>=2) ? Math.round(ratings[n-1]-prevAvg) : null;
  return { ratings, cum, current: n? Math.round(cum[n-1]) : null, delta };
}

/* ---------- charts ---------- */
function chartSVG(st){
  const { ratings, cum } = progression(st);
  const n = ratings.length;
  if(n===0) return '<div class="help" style="padding:30px 0;text-align:center">No sessions yet — the progression chart fills in after your first saved session.</div>';
  const W=640,H=170,padL=30,padR=10,padT=10,padB=22;
  const xStep = n>1 ? (W-padL-padR)/(n-1) : 0;
  const xFor = i => padL + i*xStep;
  const yFor = v => padT + (100-v)/100*(H-padT-padB);
  const linePts = ratings.map((v,i)=> xFor(i)+','+yFor(v)).join(' ');
  const cumPts = cum.map((v,i)=> xFor(i)+','+yFor(v)).join(' ');
  const areaPts = cumPts + ' ' + xFor(n-1)+','+(H-padB) + ' ' + xFor(0)+','+(H-padB);
  let grid = '';
  [0,25,50,75,100].forEach(v=>{
    const y = yFor(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--border-soft)" stroke-width="1"/>`;
    grid += `<text x="${padL-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--text-3)" font-family="IBM Plex Mono, monospace">${v}</text>`;
  });
  const dots = ratings.map((v,i)=> `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="${i===n-1?4:2.5}" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H+16}" width="100%" style="overflow:visible">
    ${grid}
    <polygon points="${areaPts}" fill="var(--accent-tint)" opacity="0.7"/>
    <polyline points="${cumPts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <polyline points="${linePts}" fill="none" stroke="var(--text-3)" stroke-width="1.3" stroke-dasharray="2 3"/>
    ${dots}
    <text x="${padL}" y="${H+13}" font-size="9.5" fill="var(--text-3)">${esc(fmtDate(st.sessions[0].date))}</text>
    <text x="${W-padR}" y="${H+13}" text-anchor="end" font-size="9.5" fill="var(--text-3)">${esc(fmtDate(st.sessions[n-1].date))}</text>
  </svg>`;
}

/* ---------- render: header ---------- */

  const chips = state.students.map(s=>{
    const live = state.liveSession && state.liveSession.studentId===s.id;
    return `<button class="studentchip ${s.id===state.activeStudentId?'active':''}" onclick="selectStudent('${s.id}')">
      <span class="avatar" style="background:${s.color}">${esc(initials(s.name))}</span>
      <span class="name">${esc(s.name)}</span>
      ${live?'<span class="livepip"></span>':''}
    </button>`;
  }).join('');
  return `
  <div class="topbar no-print">
    <div class="brand">
      <div class="brand-mark">🗣️</div>
      <div><div class="brand-name">Lesson Copilot</div><div class="brand-tag">Runs beside any call · your records stay on this device</div></div>
    </div>
    <div class="studentbar">
      ${chips}
      <button class="btn btn-sm" onclick="openAddStudent()">+ Student</button>
    </div>

    </div>
  </div>`;
}

/* ---------- render: session view ---------- */
function renderSession(st){
  const live = liveMistakeFor(st);
  const otherLive = state.liveSession && state.liveSession.studentId!==st.id;

  if(!live){
    return `
    <div class="card" style="text-align:center;padding:34px 20px">
      <div class="eyebrow">Ready when you are</div>
      <h2 style="font-size:18px;margin:8px 0 6px">Start a session with ${esc(st.name)}</h2>
      <p class="help" style="max-width:440px;margin:0 auto 14px">Turn on recording and just teach — the transcript builds itself, with likely moments highlighted for you to tag after class. You can also log anything by hand in the moment if you'd rather.</p>
      <button class="btn btn-primary" ${otherLive?'disabled':''} onclick="startSession()">Start session</button>
      ${otherLive?'<div class="mini" style="margin-top:8px">Finish the session already running for another student first.</div>':''}

        <div id="interimLine" class="mini" style="min-height:16px;font-style:italic"></div>
        <div id="transcriptLog" class="translog">${(live.transcript||[]).filter(l=>!l.done).map(l=>transcriptLineHTML(live.sessionId,l)).join('')}</div>

        <div style="display:flex;gap:6px">
          <input id="watchInput" placeholder="e.g. subjunctive" style="flex:1 1 auto;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)" onkeydown="if(event.key==='Enter')addWatchTerm()">
          <button class="btn btn-sm" onclick="addWatchTerm()">Add</button>

      <div class="card">
        <div class="sectionhead"><h3>Log a mistake manually</h3></div>

          <div class="formrow">

            <div class="field" style="flex:2 1 220px"><label>Correction (optional)</label><input id="mFix" placeholder="estoy cansada"></div>

/* ---------- render: file view ---------- */
function renderFile(st){
  const prog = progression(st);
  const deltaBadge = prog.delta===null ? `<span class="mini">First session — nothing to compare yet</span>` :
    prog.delta>0 ? `<span class="deltabadge delta-up">▲ +${prog.delta}% vs recent average</span>` :
    prog.delta<0 ? `<span class="deltabadge delta-down">▼ ${prog.delta}% vs recent average</span>` :
    `<span class="deltabadge delta-flat">steady</span>`;

  const needsAttention = st.mistakes.filter(m=>m.occurrences.length>1).sort((a,b)=>b.occurrences.length-a.occurrences.length);
  const singles = st.mistakes.filter(m=>m.occurrences.length===1);

  const groups = {};
  Object.keys(GTYPES).forEach(k=>groups[k]=[]);
  st.glossary.forEach(g=>groups[g.type]?.push(g));

  return `
  <div class="stack">
    <div class="card">
      <div class="sectionhead">
        <div>
          <h3 style="font-size:16px">${esc(st.name)}'s progression</h3>
          <div class="mini">${esc(st.lang)} &middot; ${esc(st.level)} &middot; ${st.sessions.length} session${st.sessions.length===1?'':'s'} logged</div>
        </div>
        <div class="no-print" style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn btn-sm" onclick="window.print()">Save as PDF</button>
          <button class="btn btn-sm" onclick="exportStudent('${st.id}')">Export file (.json)</button>
          <button class="btn btn-ghost btn-sm" onclick="deleteStudent('${st.id}')">Delete student</button>
        </div>
      </div>
      <div class="statrow" style="margin-bottom:14px">
        <div class="stat"><div class="num">${prog.current===null?'—':prog.current+'%'}</div><div class="lbl">Current average</div></div>
        <div class="stat"><div class="num">${needsAttention.length}</div><div class="lbl">Recurring mistakes</div></div>
        <div class="stat"><div class="num">${st.glossary.length}</div><div class="lbl">Terms in glossary</div></div>
        <div class="stat" style="display:flex;align-items:center">${deltaBadge}</div>
      </div>
      <div class="chart-wrap">${chartSVG(st)}</div>
      ${st.sessions.length ? `
      <div class="divider"></div>
      <div class="eyebrow" style="margin-bottom:8px">Session history</div>
      <div style="overflow-x:auto">
      <table class="sess"><thead><tr><th>Date</th><th>Duration</th><th>Score</th><th>Notes</th><th class="no-print">Transcript</th></tr></thead><tbody>
        ${st.sessions.slice().reverse().map(s=>{
          const unread = (s.transcript||[]).filter(l=>!l.done && l.tags.length).length;
          return `<tr>
          <td class="mono">${esc(fmtDateFull(s.date))}</td>
          <td class="mono">${s.durationMin}m</td>
          <td class="mono">${s.rating}%</td>
          <td class="notes">${esc(s.notes)||'—'}</td>
          <td class="no-print">${(s.transcript&&s.transcript.length) ? `<button class="linkbtn" onclick="openReview('${s.id}')">Review${unread?` <span class="reviewbadge">${unread}</span>`:''}</button>` : '—'}</td>
        </tr>`;
        }).join('')}
      </tbody></table>
      </div>` : ''}
    </div>

    <div class="card">
      <div class="sectionhead"><h3>Needs attention</h3><span class="mini mono">${needsAttention.length}</span></div>
      ${needsAttention.length ? `<div class="stack" style="gap:8px">${needsAttention.map(m=>{
        const c = CATS[m.category];
        const last = m.occurrences[m.occurrences.length-1];
        return `<div class="mistakecard flagged">
          <div class="row">
            <span class="pill" style="background:var(${c.t});color:var(${c.v})">${c.label}</span>
            <span class="count">×${m.occurrences.length}</span>
          </div>
          <div class="txt">${esc(m.text)}</div>
          ${m.correction?`<div class="fix">→ ${esc(m.correction)}</div>`:''}
          <div class="mini">last seen ${esc(fmtDate(last.date))}</div>
        </div>`;
      }).join('')}</div>` : `<div class="help">No repeat mistakes yet — recurring patterns will collect here as sessions add up.</div>`}
      ${singles.length ? `<div style="margin-top:12px">
        <button class="btn btn-ghost btn-sm no-print" onclick="showFullLog=!showFullLog;render()">${showFullLog?'Hide':'Show'} ${singles.length} one-off mistake${singles.length===1?'':'s'}</button>
        ${showFullLog ? `<div class="quietlist" style="margin-top:8px">${singles.map(m=>`
          <div class="quietrow"><span>${esc(m.text)}</span>${m.correction?`<span class="mini">→ ${esc(m.correction)}</span>`:''}</div>`).join('')}</div>` : ''}
      </div>` : ''}
    </div>

    <div class="card">
      <div class="sectionhead">
        <h3>Vocabulary &amp; constructs</h3>
        <button class="btn btn-sm no-print" ${st.glossary.length?'':'disabled'} onclick="startPractice('${st.id}')">Practice flashcards</button>
      </div>
      ${st.glossary.length ? Object.entries(GTYPES).map(([k,meta])=>{
        const items = groups[k]; if(!items.length) return '';
        return `<div style="margin-bottom:14px">
          <div class="eyebrow" style="margin-bottom:8px;color:var(${meta.v})">${meta.label} &middot; ${items.length}</div>
          <div class="glossgrid">${items.map(g=>`
            <div class="glosscard">
              <div class="row"><span class="term">${esc(g.term)}</span><span class="mini mono no-print">×${g.occurrences.length}</span></div>
              ${g.meaning?`<div class="meaning">${esc(g.meaning)}</div>`:''}
              ${g.example?`<div class="example">"${esc(g.example)}"</div>`:''}
            </div>`).join('')}
          </div>
        </div>`;
      }).join('') : `<div class="help">Nothing taught yet — vocabulary and constructs you add during sessions collect here, grouped by type.</div>`}
    </div>

    <div class="card no-print">
      <div class="sectionhead">
        <h3>Share with ${esc(st.name)}</h3>
        <button class="btn btn-sm" onclick="copyStudentLink()">Copy student link</button>
      </div>
      <p class="help">There's a separate, simplified link just for students — no login, no tutor controls, no access to any other student's data. Send ${esc(st.name)} two things: the <strong>student link</strong> (button above) and their <strong>exported file</strong> (button up top). They open the link once, use Import to load their file, and see their own progression, corrections and glossary, with flashcard practice built in. Whenever you export an updated file for them later, importing it again cleanly replaces the old one — no duplicates.</p>
    </div>
  </div>`;
}

/* ---------- transcript review (after the fact) ---------- */
function openReview(sessionId){ reviewSessionId = sessionId; render(); }
function renderReview(st){
  const sess = st.sessions.find(s=>s.id===reviewSessionId);
  if(!sess){ reviewSessionId=null; return renderFile(st); }
  const lines = (sess.transcript||[]).filter(l=>!l.done);
  return `
  <div class="card">
    <div class="sectionhead">
      <div><h3>Reviewing session from ${esc(fmtDateFull(sess.date))}</h3><div class="mini">${lines.length} moment${lines.length===1?'':'s'} left to review</div></div>
      <button class="btn btn-sm" onclick="reviewSessionId=null;render()">Back to file</button>
    </div>
    ${lines.length ? `<div class="translog" style="max-height:none">${lines.map(l=>transcriptLineHTML(sess.id,l)).join('')}</div>` : `<div class="help">Nothing left to review in this session — everything's been tagged or dismissed.</div>`}
  </div>`;
}

/* ---------- flashcards ---------- */
function startPractice(id){
  startPracticeFor(state.students.find(s=>s.id===id));
}
function startPracticeFor(st){
  if(!st || !st.glossary.length) return;
  practice = { active:true, idx:0, order: shuffled(st.glossary.map(g=>g.id)), revealed:false, typeFilter:'all' };
  render();
}
function shuffled(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function practiceItems(st){
  return practice.typeFilter==='all' ? st.glossary : st.glossary.filter(g=>g.type===practice.typeFilter);
}
function renderPractice(st){
  const items = practice.order.map(id=>st.glossary.find(g=>g.id===id)).filter(g=>g && (practice.typeFilter==='all'||g.type===practice.typeFilter));
  if(!items.length){ practice.active=false; return renderFile(st); }
  if(practice.idx>=items.length) practice.idx=0;
  const g = items[practice.idx];
  const meta = GTYPES[g.type];
  return `
  <div class="card">
    <div class="sectionhead">
      <h3>Practice: ${esc(st.name)}'s glossary</h3>
      <div style="display:flex;gap:8px;align-items:center">
        <select onchange="practice.typeFilter=this.value;practice.idx=0;practice.revealed=false;render()">
          <option value="all" ${practice.typeFilter==='all'?'selected':''}>All types</option>
          ${Object.entries(GTYPES).map(([k,v])=>`<option value="${k}" ${practice.typeFilter===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm" onclick="practice.active=false;render()">Back to file</button>
      </div>
    </div>
    <div class="flash">
      <div class="mini">${practice.idx+1} of ${items.length}</div>
      <div class="flashcard" onclick="practice.revealed=!practice.revealed;render()">
        <span class="pill" style="background:var(${meta.t});color:var(${meta.v})">${meta.label}</span>
        <div class="term">${esc(g.term)}</div>
        ${practice.revealed ? `<div class="reveal">
            ${g.meaning?`<div class="meaning">${esc(g.meaning)}</div>`:''}
            ${g.example?`<div class="example">"${esc(g.example)}"</div>`:''}
          </div>` : `<div class="tap">tap to reveal</div>`}
      </div>
      <div class="flashctrl">
        <button class="btn btn-sm" onclick="practice.idx=(practice.idx-1+${items.length})%${items.length};practice.revealed=false;render()">Prev</button>
        <button class="btn btn-sm" onclick="practice.order=shuffled(practice.order);practice.idx=0;practice.revealed=false;render()">Shuffle</button>
        <button class="btn btn-sm btn-primary" onclick="practice.idx=(practice.idx+1)%${items.length};practice.revealed=false;render()">Next</button>
      </div>
    </div>
  </div>`;
}

/* ---------- import / export ---------- */
function exportStudent(id){
  const st = state.students.find(s=>s.id===id); if(!st) return;
  const data = JSON.stringify({ kind:'lesson-copilot-student', exportedAt: Date.now(), student: st }, null, 2);
  const filename = st.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-lesson-file.json';
  if(window.claude?.downloads){
    window.claude.downloads.save({ filename, data })
      .then(()=>toast('Saved '+filename))
      .catch(err=>toast(err?.code==='declined' ? 'Export cancelled' : 'Could not save the file'));
  } else {
    toast('Downloads are not available in this view');
  }
}
function exportAll(){
  const data = JSON.stringify({ kind:'lesson-copilot-backup', exportedAt: Date.now(), state }, null, 2);
  if(window.claude?.downloads){
    window.claude.downloads.save({ filename:'lesson-copilot-backup.json', data })
      .then(()=>toast('Backup saved'))
      .catch(err=>toast(err?.code==='declined' ? 'Backup cancelled' : 'Could not save the backup'));
  } else {
    toast('Downloads are not available in this view');
  }
}
function extractStudents(data){
  if(data.kind==='lesson-copilot-student' && data.student) return [data.student];
  if(data.kind==='lesson-copilot-backup' && data.state?.students) return data.state.students;
  if(data.student) return [data.student];
  if(Array.isArray(data.students)) return data.students;
  if(data.id && Array.isArray(data.sessions)) return [data];
  return [];
}
function copyStudentLink(){
  const url = location.origin + location.pathname + '?student=1';
  const done = () => toast('Student link copied');
  const fail = () => {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy this link: '+url); }
    ta.remove();
  };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(url).then(done).catch(fail);
  else fail();
}
function handleStudentImport(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('That file is not valid JSON'); return; }
    const incoming = extractStudents(data)[0];
    if(!incoming){ toast("Couldn't find your lesson file in there"); return; }
    studentState.student = JSON.parse(JSON.stringify(incoming));
    saveStudentState();
    practice.active = false;
    render();
    toast('Loaded ' + (incoming.name || 'your file'));
  };
  reader.readAsText(file);
  document.getElementById('studentImportFile').value='';
}
function handleImport(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('That file is not valid JSON'); return; }
    const incoming = extractStudents(data);
    if(!incoming.length){ toast("Couldn't find a student record in that file"); return; }
    incoming.forEach(s=>{
      const copy = JSON.parse(JSON.stringify(s));
      copy.id = uid();
      copy.color = copy.color || colorFor(copy.name||'?');
      state.students.push(copy);
      state.activeStudentId = copy.id;
    });
    save(); view='file'; render();
    toast(incoming.length>1 ? `Imported ${incoming.length} students` : `Imported ${incoming[0].name}`);
  };
  reader.readAsText(file);
  document.getElementById('importFile').value='';
}

      <div class="chart-wrap">${chartSVG(st)}</div>
    </div>

    <div class="card">
      <div class="sectionhead"><h3>Things to keep working on</h3><span class="mini mono">${needsAttention.length}</span></div>
      ${needsAttention.length ? `<div class="stack" style="gap:8px">${needsAttention.map(m=>{
        const c = CATS[m.category];
        return `<div class="mistakecard flagged">
          <div class="row"><span class="pill" style="background:var(${c.t});color:var(${c.v})">${c.label}</span><span class="count">×${m.occurrences.length}</span></div>
          <div class="txt">${esc(m.text)}</div>
          ${m.correction?`<div class="fix">→ ${esc(m.correction)}</div>`:''}
        </div>`;
      }).join('')}</div>` : `<div class="help">Nothing repeat-flagged — nice work.</div>`}
      ${singles.length ? `<div style="margin-top:12px">
        <button class="btn btn-ghost btn-sm no-print" onclick="showFullLog=!showFullLog;render()">${showFullLog?'Hide':'Show'} ${singles.length} more note${singles.length===1?'':'s'}</button>
        ${showFullLog ? `<div class="quietlist" style="margin-top:8px">${singles.map(m=>`
          <div class="quietrow"><span>${esc(m.text)}</span>${m.correction?`<span class="mini">→ ${esc(m.correction)}</span>`:''}</div>`).join('')}</div>` : ''}
      </div>` : ''}
    </div>

    <div class="card">
      <div class="sectionhead"><h3>Vocabulary &amp; constructs</h3></div>
      ${st.glossary.length ? Object.entries(GTYPES).map(([k,meta])=>{
        const items = groups[k]; if(!items.length) return '';
        return `<div style="margin-bottom:14px">
          <div class="eyebrow" style="margin-bottom:8px;color:var(${meta.v})">${meta.label} &middot; ${items.length}</div>
          <div class="glossgrid">${items.map(g=>`
            <div class="glosscard">
              <div class="term">${esc(g.term)}</div>
              ${g.meaning?`<div class="meaning">${esc(g.meaning)}</div>`:''}
              ${g.example?`<div class="example">"${esc(g.example)}"</div>`:''}
            </div>`).join('')}
          </div>
        </div>`;
      }).join('') : `<div class="help">Nothing here yet.</div>`}
    </div>
  </div>`;
}
function studentModeStudent(){ return studentState.student; }
function renderStudentApp(){
  const st = studentState.student;
  const body = practice.active ? renderPractice(st) :
    !st ? renderStudentImportPrompt() : renderStudentReport(st);
  document.getElementById('app').innerHTML = renderStudentHeader() + `<div class="shell" style="padding-top:0">${body}</div>`;
}

/* ---------- main render ---------- */
function render(){
  if(STUDENT_MODE) return renderStudentApp();
  clearInterval(timerHandle); timerHandle=null;
  const st = activeStudent();
  const app = document.getElementById('app');

  if(!st){
    app.innerHTML = renderHeader() + `
    <div class="shell" style="padding-top:0">
      <div class="emptystate">
        <h2>Set up your first student</h2>
        <p>Lesson Copilot sits beside your call. Turn on recording and it transcribes the session live, highlighting moments worth a look — you review and tag them whenever you have time. It keeps a running file per student with their progression and glossary.</p>
        <button class="btn btn-primary" onclick="openAddStudent()">Add a student</button>
      </div>
    </div>`;
    return;
  }

  const live = liveMistakeFor(st);
  const body = practice.active ? renderPractice(st) :
    (view==='file' && reviewSessionId) ? renderReview(st) :
    view==='session' ? renderSession(st) : renderFile(st);

  document.getElementById('app').innerHTML = renderHeader() + `
    <div class="shell" style="padding-top:0">
      <div class="tabs no-print">
        <button class="tab ${view==='session'?'active':''}" onclick="practice.active=false;reviewSessionId=null;view='session';render()">Live session ${live?'<span class=\"livepip\"></span>':''}</button>
        <button class="tab ${view==='file'?'active':''}" onclick="practice.active=false;reviewSessionId=null;view='file';render()">Student file</button>
      </div>
      ${body}
    </div>`;

  if(live && view==='session' && !practice.active){
    tickTimer();
    timerHandle = setInterval(tickTimer, 1000);
  }
}

if(state.students.length && !state.activeStudentId) state.activeStudentId = state.students[0].id;
if(state.students.length===0) view='session';
render();
</script>
